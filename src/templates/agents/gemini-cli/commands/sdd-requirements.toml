name = "sdd-requirements"
description = "Create EARS-format requirements specification for a feature"

[[instructions]]
role = "system"
content = """
You are executing the /sdd-requirements command to create a requirements specification using EARS format.

# Command Format

/sdd-requirements <feature-name>

Example: /sdd-requirements authentication

# Your Task

Create a comprehensive requirements specification for the given feature using EARS (Easy Approach to Requirements Syntax) format.

# Step 1: Read Project Memory (IMPORTANT)

**ALWAYS read steering files FIRST to understand project context:**

- Read `steering/structure.md` - Architecture patterns
- Read `steering/tech.md` - Technology stack
- Read `steering/rules/itg/README.md` - ITG delivery policies: read the files mapped to your task
- Read `steering/product.md` - Product context
- Read `steering/project.yml` - Constitution profile (library | cli | application, default `library`)

# Step 2: Understand the Feature

1. Ask user for feature details if needed
2. Understand the business goal
3. Identify affected components (based on steering/structure.md)
4. Consider technical constraints (based on steering/tech.md)
5. Align with product vision (based on steering/product.md)

# Step 3: Generate EARS Requirements

Each requirement SHALL use one of the 5 EARS patterns (IV-1):

## 1. Ubiquitous Requirements
Format: The [system] SHALL [requirement]

Example:
- The system SHALL store each RSVP with the tenant of the meeting
- The RSVP service SHALL record one response per member and meeting

## 2. Event-Driven Requirements
Format: WHEN [event], the [system] SHALL [response]

Example:
- WHEN a member submits an RSVP, the system SHALL store the response and emit `rsvp.response.set`
- WHEN the RSVP deadline passes, the system SHALL send the organizer a summary email

## 3. State-Driven Requirements
Format: WHILE [state], the [system] SHALL [response]

Example:
- WHILE the meeting page is open, the system SHALL refresh the RSVP list every 30 seconds
- WHILE a meeting is cancelled, the system SHALL reject new RSVPs

## 4. Unwanted Behavior
Format: IF [condition], THEN the [system] SHALL [response]

Example:
- IF the member belongs to another tenant, THEN the system SHALL return 403 and emit `rsvp.response.set.denied`
- IF the RSVP deadline has passed, THEN the system SHALL return 409 `RSVP_CLOSED`

## 5. Optional Features
Format: WHERE [feature enabled], the [system] SHALL [requirement]

Example:
- WHERE the reminders feature is switched on, the system SHALL email members who have not responded
- WHERE the meeting has a guest limit, the system SHALL reject a "yes" beyond the limit

# Step 4: Requirement Structure

For each requirement:

1. **Requirement ID**: REQ-<FEATURE>-NNN
   Example: REQ-AUTH-001, REQ-AUTH-002

2. **Title**: Clear, descriptive name

3. **EARS Statement**: Using one of the 5 patterns (IV-1), with a single interpretation (IV-2)

4. **Acceptance Criteria**: Testable conditions (IV-3)
   - GIVEN [context]
   - WHEN [action]
   - THEN [expected result]

5. **Priority**: Must-Have / Should-Have / Nice-to-Have

6. **Dependencies**: Links to other requirements

# Step 5: Document Structure

Create a requirements document with:

## Header
- Feature Name
- Version
- Date
- Author
- Status

## 1. Overview
- Feature description
- Business value
- Affected components (from steering/structure.md)

## 2. Functional Requirements
Group by category:
- User Management
- Authentication
- Authorization
- Error Handling
- etc.

For each requirement:
- ID: REQ-<FEATURE>-NNN
- Title
- EARS statement
- Acceptance criteria
- Priority
- Dependencies

## 3. Non-Functional Requirements
- Performance (response time, throughput)
- Security (based on Constitutional Article - OWASP Top 10)
- Reliability (uptime, error rates)
- Scalability
- Maintainability

## 4. Technical Constraints
Based on steering/tech.md:
- Technology stack alignment
- Framework requirements
- Database requirements
- API design (REST/GraphQL/gRPC)

## 5. Constitutional Compliance

Ensure requirements align with Constitutional Articles:

- **Article I: Testable Core** - Feature logic in a core module tested without the UI, server or CLI (library in lib/ for library / cli, `src/lib/<domain>/` for application)
- **Article II: Automation Interface** - Primary operations reachable without the UI (CLI for library / cli, HTTP API for application)
- **Article III: Test-First** - Requirements include test scenarios
- **Article IV: EARS Format** - All requirements in EARS format, unambiguous, with acceptance criteria (IV-1 to IV-3)
- **Article V: Traceability** - Each requirement traceable to design, code and tests (IV-4, V-1 to V-3)

## 6. Dependencies
- Other features required
- External services
- Infrastructure needs

## 7. Risks & Assumptions
- Technical risks
- Business assumptions
- Dependencies on external factors

# Step 6: Save Document

Save to: `storage/specs/{{feature-name}}-requirements.md`

# Example Output

```markdown
# Feature Requirements: Meeting RSVP

**Version**: 1.0
**Date**: 2026-10-22
**Status**: Draft

## 1. Overview

Members tell the organizer whether they attend a meeting.

**Business Value**: Organizers plan rooms and catering from real numbers
**Affected Components**: src/lib/rsvp/, src/app/api/rsvp/, src/features/rsvp/

## 2. Functional Requirements

#### REQ-RSVP-001: Record an RSVP
**EARS**: WHEN a member submits an RSVP for a meeting of their tenant, the system SHALL store the response (yes, no, maybe) and emit `rsvp.response.set`.

**Acceptance Criteria**:
- GIVEN a signed-in member and an open meeting of their tenant
- WHEN the member submits "yes"
- THEN the system SHALL store one RSVP for that member and meeting
- AND a second submission SHALL replace the first

**Priority**: Must-Have
**Dependencies**: None

#### REQ-RSVP-002: RSVP deadline
**EARS**: IF the RSVP deadline of the meeting has passed, THEN the system SHALL reject the RSVP with 409 `RSVP_CLOSED`.

**Acceptance Criteria**:
- GIVEN a meeting whose deadline has passed
- WHEN a member submits an RSVP
- THEN the system SHALL return 409 with code `RSVP_CLOSED`

**Priority**: Must-Have
**Dependencies**: REQ-RSVP-001

#### REQ-RSVP-003: Tenant isolation
**EARS**: IF the member's tenant differs from the meeting's tenant, THEN the system SHALL return 403 and emit `rsvp.response.set.denied`.

**Acceptance Criteria**:
- GIVEN a member of tenant B and a meeting of tenant A
- WHEN the member submits an RSVP
- THEN the system SHALL return 403
- AND no RSVP SHALL be stored

**Priority**: Must-Have
**Dependencies**: REQ-RSVP-001

## 3. Non-Functional Requirements

### Security
- Identity and tenant SHALL come from the verified ID token claims (ITG-SEC-05)
- The route SHALL go through `withApiRoute` with `withRole('member')`, the `write` rate limit and a zod schema (ITG-SEC-13, ITG-SEC-14)

### Performance
- Recording an RSVP SHALL respond in < 500 ms at the 95th percentile

## 4. Constitutional Compliance

- ✅ Article I: Feature logic in the core module `src/lib/rsvp/` (application profile)
- ✅ Article II: The HTTP API is the automation interface (application profile)
- ✅ Article III: Test scenarios defined
- ✅ Article IV: All requirements in EARS format
- ✅ Article V: Traceability matrix included
```

# Validation

Before finalizing:

1. **EARS Compliance**:
   - All requirements use EARS patterns (IV-1)
   - Keywords correct (WHEN, SHALL, IF, THEN, WHERE, WHILE)
   - Requirements are unambiguous (IV-2)

2. **Constitutional Compliance**:
   - Core module approach documented for the project profile (Article I)
   - Automation interface requirements included: CLI for library / cli, HTTP API for application (Article II)
   - Test scenarios defined
   - Traceability considered

3. **Completeness**:
   - Functional requirements covered
   - Non-functional requirements included
   - Dependencies identified
   - Acceptance criteria defined (IV-3)

# Next Steps

After requirements are complete:
1. User reviews and approves
2. Proceed to design: /sdd-design {{feature-name}}
3. Or validate compliance: /sdd-validate {{feature-name}}

**Execute requirements generation now.**
"""
