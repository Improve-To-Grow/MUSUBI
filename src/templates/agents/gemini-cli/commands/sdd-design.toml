name = "sdd-design"
description = "Generate technical design with C4 model and ADR based on requirements"

[[instructions]]
role = "system"
content = """
You are executing the /sdd-design command to create a technical design specification.

# Command Format

/sdd-design <feature-name>

Example: /sdd-design authentication

# Your Task

Create a comprehensive technical design for the given feature based on requirements.

# Step 1: Read Project Memory and Requirements

**IMPORTANT: Read these files FIRST:**

1. **Steering Context**:
   - `steering/structure.md` - Architecture patterns
   - `steering/tech.md` - Technology stack
   - `steering/rules/itg/README.md` - ITG delivery policies: read the files mapped to your task
   - `steering/product.md` - Product context
   - `steering/project.yml` - `constitution.profile` (library | cli | application; `library` when absent)

2. **Requirements**:
   - `storage/specs/{{feature-name}}-requirements.md` - Feature requirements

# Step 2: Design Approach

Follow this design methodology:

1. **Understand Requirements**: Map all EARS requirements
2. **Align with Architecture**: Follow patterns from steering/structure.md
3. **Technology Alignment**: Use stack from steering/tech.md
4. **C4 Model**: Create Mermaid C4 architecture diagrams (ITG-DEL-12)
5. **ADR**: Document architectural decisions
6. **API Design**: Define interfaces
7. **Data Model**: Design database schema
8. **Integration**: Define component interactions

# Step 3: Design Document Structure

## 1. Overview
- Feature name and version
- Link to requirements document
- Design goals
- Constraints from steering

## 2. Architecture (Mermaid C4)

Every architecture diagram SHALL be a Mermaid C4 block, and every decision tree a Mermaid `flowchart` (ITG-DEL-12). Do not use ASCII art. Start from the context and container views in `steering/tech.md`.

### Context Diagram (Level 1): `C4Context`
- Users, the system, external systems (Firebase, Azure Communication Services, Vertex AI, ITG log-ingest, vendor APIs)

### Container Diagram (Level 2): `C4Container`
- Worker (Next.js via OpenNext), Firebase Functions, Firestore, R2
- PostgreSQL only when ITG-DAT-02 applies; n8n only when ITG-INT-06 applies

### Component Diagram (Level 3): `C4Component`
- Route handlers through `withApiRoute`, guards, feature services in `src/features/<domain>/api/`, `src/lib` modules

### Code Organization (Level 4)
- Directory structure aligned with steering/structure.md: `src/features/<domain>/`, `src/types/<domain>/<entity>.ts`, shared code in `src/lib/`

## 3. Architectural Decision Records (ADRs)

For each major decision: Status, Context, Decision, Consequences, Alternatives Considered. Write an ADR for the database choice (ITG-DAT-02), every deviation from an ITG rule, every runtime-constraint client (VIII-5) and background job placement (ITG-INT-06).

Example:
```
ADR-001: Store RSVPs in Firestore

Status: Accepted
Context: REQ-RSVP-001 needs per-meeting RSVPs, refreshed by polling an API route; a few hundred per meeting
Decision: Firestore collection `rsvps`, scoped by tenantId (ITG-DAT-01, ITG-DAT-02)
Consequences:
  + No extra database; every read passes the account-state check; the tenant-scoped helper enforces the scope
  - Cross-meeting reporting needs an export
Alternatives: PostgreSQL, rejected (small, non-relational data)
```

## 4. Requirements Mapping and ITG Policy Compliance

| Requirement ID | Component | Implementation |
|---------------|-----------|----------------|
| REQ-RSVP-001  | POST /api/rsvp | withApiRoute + withAuth, zod schema |
| REQ-RSVP-002  | src/features/rsvp/api/ | recordRsvp() |

Add a table of the ITG rules the design relies on or deviates from (read `steering/rules/itg/README.md`):

| Rule | How the design meets it |
|------|-------------------------|
| ITG-SEC-13 | Every route exported through withApiRoute with a guard |
| ITG-SEC-05 | Organization id read from custom claims only |
| ITG-LOG-02 | rsvp.response.set with .denied and .failed |

## 5. API Design

Every endpoint is a `src/app/api/**/route.ts` exported through `withApiRoute('<route-id>', guard(handler), { rateLimit, schema })` and returns `{ success: true, data }` or `{ success: false, error: { code, message } }` (ITG-SEC-13, ITG-SEC-14).

**POST /api/rsvp**
- Route id: `api-rsvp-create`; guard `withAuth`; rate limit `write`; schema `createRsvpSchema` (zod)
- Request: { meetingId: string, response: "yes" | "no" | "maybe" }
- Response: { success: true, data: { rsvpId: string } }
- Errors: 400 badRequest, 401 unauthorized, 403 forbidden, 409 conflict RSVP_CLOSED, 429 tooManyRequests
- Events: rsvp.response.set, .denied, .failed (ITG-LOG-07)
- Requirements: REQ-RSVP-001

## 6. Data Model

Decide Firestore or PostgreSQL with `steering/rules/itg/data.md` (ITG-DAT-02). Draw the model as a Mermaid `erDiagram`; give every entity only the fields the product needs (ITG-DAT-10) and, if multi-tenant, a tenant field (ITG-SEC-10). Roles live in custom claims; a user document holds at most a role copy written by the claim endpoint (ITG-SEC-06).

```mermaid
erDiagram
    MEETING ||--o{ RSVP : has
    RSVP {
        string id
        string tenantId
        string meetingId
        string userId
        string response
    }
```

- Firestore: collections, indexes (`firestore.indexes.json`); rules deny all client access, Storage uploads tenant-scoped (ITG-SEC-15)
- PostgreSQL (only if ITG-DAT-02 applies): numbered, append-only migrations `database/migrations/NNNN_<name>.sql`, applied by the deploy workflow (ITG-DAT-05 to ITG-DAT-07)

## 7. Component Design

Choose the variant for `constitution.profile` (Article I: Testable Core). The design SHALL name the core module for each feature (I-1).

- **`library` / `cli`**: each feature is a standalone library, e.g. `lib/rsvp/` with its own tests, a public API (`index.ts`) and a CLI (`cli.ts`) (I-L1–I-L3, II-L1)
- **`application`** (ITG): each feature is a self-contained folder `src/features/<domain>/` (components, hooks, api, types.ts); shared logic is in the core path `src/lib/`; route handlers delegate to the feature service (I-A3, II-A3). The design SHALL list the delivery paths and each machine-facing endpoint with its input schema and documented status and error codes (II-A4, II-A5)

```typescript
// src/features/rsvp/api/rsvp-service.ts
export async function recordRsvp(tenantId: string, input: CreateRsvpInput): Promise<Rsvp>
```

## 8. Integration Points

### Internal Dependencies
- `src/lib/firebase-rest/` (runtime-constraint client: `firebase-admin` cannot run on Workers, VIII-4)
- `src/lib/email/` (`sendEmail()`, ACS), `src/lib/audit/`, `src/lib/logs/`

### External Dependencies
- Firebase Authentication and Firestore (REST)
- Azure Communication Services (ITG-INT-03)
- Vertex AI only, never the public Gemini API (ITG-SEC-20)
- Each one documented in `documentation/INTEGRATIONS.md` (ITG-INT-08)

## 9. Security Design

Follow `steering/rules/itg/security.md`:

- **A01: Broken Access Control**: roles and tenant from custom claims only; guards in withApiRoute; Firestore rules deny all client access (ITG-SEC-05, ITG-SEC-13, ITG-SEC-15)
- **A02: Cryptographic Failures**: Firebase Authentication; bearer ID token verified per request, no session cookie (ITG-SEC-11)
- **A03: Injection**: zod schemas on every route (ITG-PLT-06)
- **A05: Security Misconfiguration**: configuration only in GitHub Environments; nonce-based CSP in middleware (ITG-PLT-08, ITG-SEC-22)
- **A07: Authentication Failures**: App Check, reCAPTCHA enforcement, account-state check, admin TOTP MFA, rate limiting (ITG-SEC-01, ITG-SEC-02, ITG-SEC-04)

## 10. Performance Considerations

- **Runtime**: Worker bundle within 10 MiB; no heavy SDKs in the Worker (ITG-PLT-18)
- **Shared state**: Cloudflare KV, Durable Objects or Rate Limiting bindings, never isolate memory (ITG-PLT-17)
- **Data**: Firestore composite indexes for every query
- **Async work**: Firebase Functions for triggers and schedules; n8n only for large workflows (ITG-INT-06)

## 11. Error Handling

Typed `ApiRouteError` helpers (`badRequest`, `unauthorized`, `forbidden`, `notFound`, `conflict`, `tooManyRequests`); anything else becomes a generic 500 and an `error_events` row. Status codes are never derived from message text (ITG-SEC-14).

```json
{
  "success": false,
  "error": { "code": "RSVP_CLOSED", "message": "The RSVP deadline has passed" }
}
```

## 12. Testing Strategy

### Unit Tests (Vitest, written first)
- recordRsvp() for every acceptance criterion (ITG-TST-01, ITG-TST-02)

### Integration Tests (Vitest against the staging Firebase project, no emulator)
- POST /api/rsvp, Firestore rules, tenant isolation (ITG-TST-06, ITG-TST-08)

### E2E Tests (Playwright)
- Member RSVPs; a member of another tenant is blocked (ITG-TST-10)

### Test Coverage Requirements
- Coverage at or above the configured threshold, default 80% (III-6)
- All EARS requirements tested (III-5)
- All error paths tested

## 13. Deployment

### Configuration (GitHub Environments, listed in `.env.example`)
- New keys: [names only], each in one class: public values and server configuration as Variables, credentials as Secrets (ITG-PLT-09)

### Infrastructure
- Firestore rules and indexes deployed to both Firebase projects in the same change (ITG-PLT-23)
- New Cloudflare bindings per environment in `wrangler.jsonc` (ITG-PLT-19)

## 14. Constitutional Compliance

Verify alignment with Constitutional Articles:

- ✅ **Article I: Testable Core**: Core module named per feature: lib/rsvp/ (`library`, `cli`), or the feature folder src/features/rsvp/ and the src/lib/ modules it uses (`application`) (I-1)
- ✅ **Article II: Automation Interface**: CLI tool (`library`, `cli`), or HTTP API with schema-validated machine-facing endpoints (`application`)
- ✅ **Article III: Test-First**: Test strategy defined
- ✅ **Article IV: EARS Format**: All requirements mapped
- ✅ **Article V: Traceability**: Requirements → Design mapping complete (V-1), requirements coverage matrix included (V-5)
- ✅ **Article VII: Simplicity Gate**: At most 3 projects (VII-1); more need Phase -1 Gate approval before they are implemented (VII-2) and a justification in design.md: business requirements, technical constraints, team capacity analysis (VII-3)
- **Code-size limits (VII-4 to VII-6)**: components sized so the code can stay within source files <= 500 lines of code, functions <= 50 and imports <= 10 (`index` files exempt), or the configured `code_limits`; these limits are not Phase -1 Gate items
- ✅ **Article VIII: Anti-Abstraction**: Vendor SDKs called directly, no custom wrapper (VIII-1, VIII-2, ITG-INT-02); any abstraction over a framework needs Phase -1 Gate approval with a multi-framework support justification, a team expertise analysis and a migration path (VIII-3)
- **Runtime constraint (VIII-4, VIII-5)**: IF the design adds a project-owned client because the vendor SDK cannot run on the target runtime (e.g. `firebase-admin` on Cloudflare Workers), THEN design.md SHALL document that constraint here
- ✅ **ITG policies**: compliance table included; deviations recorded in steering

# Step 4: Save Design Document

Save to: `storage/design/{{feature-name}}-design.md`

# Example C4 Diagram

```mermaid
C4Container
    title Meeting RSVP: containers
    Person(member, "Member", "Client user")
    System_Boundary(app, "Client portal") {
        Container(web, "Web application", "Next.js on a Cloudflare Worker", "Pages and route handlers through withApiRoute")
        ContainerDb(fs, "Firestore", "Firebase", "meetings, rsvps; rules deny all client access")
    }
    System_Ext(acs, "Azure Communication Services", "Reminder email")
    System_Ext(logs, "ITG log-ingest", "Audit and app events")
    Rel(member, web, "RSVP", "HTTPS, App Check")
    Rel(web, fs, "Read and write", "REST via src/lib/firebase-rest")
    Rel(web, acs, "sendEmail()", "REST")
    Rel(web, logs, "rsvp.response.set", "HTTPS, HMAC")
```

# Validation Checklist

Before finalizing:

1. **Requirements Coverage**:
   - All requirements from requirements.md mapped
   - No missing functionality

2. **Architecture Alignment**:
   - Follows patterns from steering/structure.md
   - Uses tech stack from steering/tech.md
   - Aligns with product goals from steering/product.md

3. **Constitutional Compliance**:
   - Testable core: core module named for each feature, per the project profile (I-1)
   - Automation interface designed: CLI (`library`, `cli`), or delivery paths and machine-facing endpoints with schemas (`application`)
   - Test strategy defined
   - EARS requirements mapped
   - At most 3 projects, or gate-approved and justified (VII-1 to VII-3)
   - Framework APIs used directly (VIII-1); abstractions gate-approved and justified (VIII-2, VIII-3); runtime-constraint clients documented (VIII-5)

4. **Completeness**:
   - All major components designed
   - API contracts defined
   - Data model complete
   - Security considerations included
   - Performance strategy defined

# Next Steps

After design is complete:
1. User reviews and approves design
2. Proceed to tasks: /sdd-tasks {{feature-name}}
3. Or validate compliance: /sdd-validate {{feature-name}}

**Execute design generation now.**
"""
