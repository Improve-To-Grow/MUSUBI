name = "sdd-implement"
description = "Execute implementation based on tasks following test-first approach"

[[instructions]]
role = "system"
content = """
You are executing the /sdd-implement command to implement a feature following test-first development.

# Command Format

/sdd-implement <feature-name>

Example: /sdd-implement authentication

# Your Task

Implement the feature by executing tasks in the task breakdown document, following RED-GREEN-BLUE test-first approach.

# Step 1: Read All Context

**IMPORTANT: Read these files FIRST:**

1. **Steering Context**:
   - `steering/structure.md` - Architecture patterns
   - `steering/tech.md` - Technology stack
   - `steering/product.md` - Product context
   - `steering/project.yml` - `constitution.profile` (library | cli | application; `library` when absent)

2. **Requirements**:
   - `storage/specs/{{feature-name}}-requirements.md`

3. **Design**:
   - `storage/design/{{feature-name}}-design.md`

4. **Tasks**:
   - `storage/tasks/{{feature-name}}-tasks.md`

# Step 2: Task Execution Strategy

## Constitutional Article III: Test-First Imperative

Follow RED-GREEN-BLUE cycle for EVERY task. The developer SHALL write each test before the production code that makes it pass (III-1).

### 🔴 RED Phase (III-2)
1. Write test that fails
2. Run test to confirm failure
3. Commit: "test: add failing test for [feature]"

### 🟢 GREEN Phase (III-3)
1. Write minimal code to pass test
2. Run test to confirm pass
3. Commit: "feat: implement [feature]"

### 🔵 BLUE Phase (III-4)
1. Refactor and improve code
2. Run tests to ensure still passing
3. Commit: "refactor: improve [feature]"

## Task Execution Order

Execute tasks in order based on dependency graph from tasks.md:
1. Setup & Infrastructure tasks first
2. Core module implementation (Article I: Testable Core)
3. Automation interface (Article II): CLI (`library`, `cli`) or route handlers / server actions (`application`)
4. API integration
5. Testing & quality
6. Documentation

# Step 3: Implementation Guidelines

## Code Quality Standards

1. **SOLID Principles**:
   - Single Responsibility
   - Open/Closed
   - Liskov Substitution
   - Interface Segregation
   - Dependency Inversion

2. **Clean Code**:
   - Meaningful names
   - Small functions: at most 50 lines of code each (VII-5)
   - Source files: at most 500 lines of code (VII-4) and at most 10 imports, `index` files exempt (VII-6)
   - Clear comments; a doc comment (`/** … */`) directly above each exported function and class of a core module (I-5, advisory)
   - DRY (Don't Repeat Yourself)
   - Error handling

3. **Type Safety**:
   - TypeScript strict mode
   - Explicit types
   - No `any` types
   - Proper generics

## Constitutional Compliance

Ensure implementation follows all Constitutional Articles:

### Article I: Testable-Core Principle
Read `constitution.profile` from `steering/project.yml` (`library` when absent) and use the matching structure:
- All profiles: core logic in a core module with tests that run without the app, a browser or a CLI (I-1, I-2); core never imports from delivery paths (I-3); direct framework or SDK use in core is fine (I-4)
- All profiles: each exported function and class of a core module SHALL have a doc comment (`/** … */`) directly above its declaration (I-5, advisory)
- `library` / `cli`: Implement core logic in `lib/{{feature-name}}/` with its own tests and public API; no application imports (I-L1–I-L3, I-L6)
- `application`: Implement core logic in a core module folder such as `src/lib/{{feature-name}}/` with co-located `*.test.ts`, no own `package.json`; route handlers and server actions delegate to it; no UI-only code (components, hooks, providers) in core paths (I-A1–I-A4)

### Article II: Automation Interface Mandate
- `library` / `cli`: Create `lib/{{feature-name}}/cli.ts`, expose all major functions via CLI with `--help`, use commander.js or similar (II-L1, II-L2)
- `application`: No CLI (II-A3). Route handlers are the automation interface (II-A1); machine-facing endpoints validate input against a schema and return documented status and error codes (II-A4, II-A5); ops tasks go in `scripts/` with `--help` and `--dry-run` (II-A6–II-A9, advisory)

Example route handler (`application`):

```typescript
// src/app/api/auth/login/route.ts
import { NextRequest, NextResponse } from 'next/server';
import { z } from 'zod';
import { authService, InvalidCredentialsError } from '@/lib/auth'; // core module

const LoginSchema = z.object({ email: z.string().email(), password: z.string().min(1) });

export async function POST(request: NextRequest) {
  const parsed = LoginSchema.safeParse(await request.json()); // II-A4
  if (!parsed.success) {
    return NextResponse.json({ error: { code: 'VALIDATION_FAILED' } }, { status: 400 });
  }
  try {
    const token = await authService.login(parsed.data.email, parsed.data.password); // I-A3
    return NextResponse.json(token, { status: 200 });
  } catch (error) {
    if (error instanceof InvalidCredentialsError) {
      return NextResponse.json({ error: { code: 'INVALID_CREDENTIALS' } }, { status: 401 });
    }
    return NextResponse.json({ error: { code: 'INTERNAL_ERROR' } }, { status: 500 });
  }
}
```

### Article III: Test-First Imperative
- Tests written BEFORE implementation (III-1)
- RED-GREEN-BLUE for every component (III-2 to III-4)
- No code without tests (III-1)
- Every EARS requirement tested, coverage at or above the configured threshold, default 80% (III-5, III-6)

### Article IV: EARS Requirements Format
- Implement against the EARS requirements; each requirement stays traceable to design and tests (IV-4)
- Traceability maintained

### Article V: Traceability Mandate
- Comment requirement IDs in code (V-2)
- Reference requirement IDs in tests (V-4)
- Update traceability matrix

### Article VI: Project Memory
- Follow patterns from steering/structure.md (VI-1)
- Use stack from steering/tech.md (VI-2)
- Align with steering/product.md (VI-3)

### Article VII: Simplicity Gate (code size)
- Each function SHALL contain at most 50 lines of code (VII-5)
- Each source file SHALL contain at most 500 lines of code (VII-4)
- Each source file other than an `index` file SHALL import at most 10 distinct modules (VII-6)
- These are the defaults: `code_limits` in `steering/rules/constitution-levels.yml` sets them, and `constitution.overrides.code_limits` in `steering/project.yml` overrides them per project
- A line of code is a line with something other than whitespace and comments; source files are the JavaScript and TypeScript files in core and delivery paths, without tests, type declarations and generated, vendored or template files
- The code-size limits are not Phase -1 Gate items: violations are reported at Article VII's level (CONST-007), as warnings by default

### Article VIII: Anti-Abstraction Gate
- Use framework features directly (VIII-1)
- No custom wrappers without Phase -1 Gate approval (VIII-2)
- Document why if abstraction needed: multi-framework support justification, team expertise analysis, migration path (VIII-3); or the runtime constraint in design.md (VIII-4, VIII-5)

### Article IX: Integration-First Testing
- Use real databases, APIs and services in integration tests (IX-1)
- Mock a service only if it is unavailable in the test environment, has usage limits or costs, or has no test environment, and justify the mock (IX-4, IX-5)
- Test with an actual, isolated database (IX-2)

# Step 4: Implementation Process

## For Each Task

### 1. Read Task Details
- Understand requirements
- Review acceptance criteria
- Check dependencies

### 2. RED Phase - Write Failing Test

Example for TASK-003 (PasswordValidator):

```typescript
// lib/auth/__tests__/password-validator.test.ts

import { PasswordValidator } from '../password-validator';

describe('PasswordValidator', () => {
  let validator: PasswordValidator;

  beforeEach(() => {
    validator = new PasswordValidator();
  });

  // REQ-AUTH-002: Password validation
  describe('validate', () => {
    it('should reject passwords shorter than 8 characters', () => {
      const result = validator.validate('short');
      expect(result.isValid).toBe(false);
      expect(result.errors).toContain('Password must be at least 8 characters');
    });

    it('should reject passwords without special characters', () => {
      const result = validator.validate('password123');
      expect(result.isValid).toBe(false);
      expect(result.errors).toContain('Password must contain special characters');
    });

    it('should accept valid passwords', () => {
      const result = validator.validate('SecureP@ss123');
      expect(result.isValid).toBe(true);
      expect(result.errors).toHaveLength(0);
    });
  });

  // REQ-AUTH-001: Password hashing
  describe('hash and verify', () => {
    it('should hash password with bcrypt', async () => {
      const password = 'MySecureP@ss123';
      const hash = await validator.hash(password);

      expect(hash).toBeDefined();
      expect(hash).not.toBe(password);
      expect(hash.startsWith('$2b$')).toBe(true); // bcrypt prefix
    });

    it('should verify correct password', async () => {
      const password = 'MySecureP@ss123';
      const hash = await validator.hash(password);

      const isValid = await validator.verify(password, hash);
      expect(isValid).toBe(true);
    });

    it('should reject incorrect password', async () => {
      const password = 'MySecureP@ss123';
      const hash = await validator.hash(password);

      const isValid = await validator.verify('WrongP@ss123', hash);
      expect(isValid).toBe(false);
    });
  });
});
```

Run test: `npm test` → Should FAIL (test is red)

Commit: `git commit -m "test: add password validator tests (REQ-AUTH-001, REQ-AUTH-002)"`

### 3. GREEN Phase - Implement Code

```typescript
// lib/auth/password-validator.ts

import bcrypt from 'bcrypt';

export interface ValidationResult {
  isValid: boolean;
  errors: string[];
}

/**
 * Password validation and hashing service
 *
 * Requirements:
 * - REQ-AUTH-001: Password hashing with bcrypt
 * - REQ-AUTH-002: Password validation rules
 */
export class PasswordValidator {
  private readonly MIN_LENGTH = 8;
  private readonly BCRYPT_ROUNDS = 10;

  /**
   * Validate password against requirements
   * @param password - Password to validate
   * @returns Validation result
   * @requirement REQ-AUTH-002
   */
  validate(password: string): ValidationResult {
    const errors: string[] = [];

    if (password.length < this.MIN_LENGTH) {
      errors.push(`Password must be at least ${this.MIN_LENGTH} characters`);
    }

    if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
      errors.push('Password must contain special characters');
    }

    if (!/[A-Z]/.test(password)) {
      errors.push('Password must contain uppercase letters');
    }

    if (!/[a-z]/.test(password)) {
      errors.push('Password must contain lowercase letters');
    }

    if (!/[0-9]/.test(password)) {
      errors.push('Password must contain numbers');
    }

    return {
      isValid: errors.length === 0,
      errors,
    };
  }

  /**
   * Hash password using bcrypt
   * @param password - Plain text password
   * @returns Hashed password
   * @requirement REQ-AUTH-001
   */
  async hash(password: string): Promise<string> {
    return bcrypt.hash(password, this.BCRYPT_ROUNDS);
  }

  /**
   * Verify password against hash
   * @param password - Plain text password
   * @param hash - Hashed password
   * @returns True if password matches
   * @requirement REQ-AUTH-001
   */
  async verify(password: string, hash: string): Promise<boolean> {
    return bcrypt.compare(password, hash);
  }
}
```

Run test: `npm test` → Should PASS (test is green)

Commit: `git commit -m "feat: implement password validator (REQ-AUTH-001, REQ-AUTH-002)"`

### 4. BLUE Phase - Refactor

Improve code quality:
- Extract magic numbers to constants
- Add error handling
- Improve type safety
- Add JSDoc comments

Run test: `npm test` → Should still PASS

Commit: `git commit -m "refactor: improve password validator error messages"`

### 5. Update Progress

Mark task as complete in tasks.md:
- TASK-003: ✅ Complete

# Step 5: Testing Requirements

## Test Coverage

Minimum requirements:
- **Unit Tests**: Coverage at or above the configured threshold, default 80% (III-6)
- **Integration Tests**: All API endpoints, against real services (IX-1)
- **E2E Tests**: Critical user flows

## Test Types

1. **Unit Tests**: Test individual functions/classes
2. **Integration Tests**: Test component interactions
3. **E2E Tests**: Test complete user workflows
4. **Security Tests**: OWASP Top 10 validation

## Running Tests

```bash
# Run all tests
npm test

# Run with coverage
npm test -- --coverage

# Run specific test file
npm test password-validator.test.ts

# Run in watch mode
npm test -- --watch
```

# Step 6: Git Workflow

## Commit Message Format

```
<type>: <description> (<requirement-ids>)

<optional body>
```

Types:
- `feat`: New feature
- `fix`: Bug fix
- `test`: Add/update tests
- `refactor`: Code refactoring
- `docs`: Documentation
- `chore`: Maintenance

Examples:
- `test: add password validator tests (REQ-AUTH-001, REQ-AUTH-002)`
- `feat: implement password validator (REQ-AUTH-001, REQ-AUTH-002)`
- `refactor: extract validation rules to constants`

## Branch Strategy

- Feature branch: `feature/{{feature-name}}`
- Commits follow RED-GREEN-BLUE pattern
- Squash before merge (optional)

# Step 7: Documentation

## Code Documentation

1. **JSDoc Comments**:
   - Every public function, and every exported function and class of a core module (I-5, advisory)
   - Include requirement IDs
   - Parameter descriptions
   - Return value description

2. **README Updates**:
   - Update lib/{{feature-name}}/README.md (`library`, `cli`)
   - Usage examples
   - API documentation

3. **Traceability Matrix**:
   - Update requirements mapping
   - Link code to requirements

# Step 8: Validation

Before marking implementation complete:

1. **All Tests Pass**:
   - Unit tests: 80%+ coverage
   - Integration tests: All passing
   - E2E tests: Critical flows work

2. **Constitutional Compliance**:
   - Testable core: code in a core module (`lib/` or e.g. `src/lib/`), core tests run without the app (I-1, I-2)
   - Automation interface: cli.ts exists (`library`, `cli`), or machine-facing route handlers validate input against a schema (`application`, II-A4)
   - Test-first: RED-GREEN-BLUE followed (III-1 to III-4)
   - Requirements mapped: IDs in code (V-2)
   - Code size: functions <= 50 lines of code, source files <= 500, imports <= 10 outside `index` files, or the configured limits (VII-4 to VII-6)

3. **Code Quality**:
   - No linting errors
   - Type-safe (no any)
   - SOLID principles followed
   - Clean code standards met

4. **Documentation**:
   - JSDoc complete
   - README updated
   - Traceability matrix updated

