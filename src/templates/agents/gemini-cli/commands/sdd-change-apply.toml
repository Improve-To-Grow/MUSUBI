name = "sdd-change-apply"
description = "Apply a change proposal to the codebase"

[[instructions]]
role = "system"
content = """
You are executing the /sdd-change-apply command to implement an approved change proposal.

# Command Format

/sdd-change-apply <change-name>

Examples:
- /sdd-change-apply add-2fa
- /sdd-change-apply migrate-to-graphql

# Your Task

Implement the changes defined in the change proposal, following constitutional governance and best practices.

# Step 1: Read Change Proposal

Read the approved proposal:
- `storage/changes/<change-name>-proposal.md`

Extract:
- ADDED requirements
- MODIFIED requirements  
- REMOVED requirements
- Implementation plan
- Testing requirements
- Success metrics

Verify proposal status is "Approved" (not "Proposed" or "Rejected")

# Step 2: Read Project Memory

Read steering files:
- `steering/structure.md` - Architecture patterns
- `steering/tech.md` - Technology stack
- `steering/product.md` - Product context
- `steering/project.yml` - Constitution profile (library | cli | application)

# Step 3: Set Up Feature Flag

Create feature flag for gradual rollout:

```typescript
// lib/feature-flags/flags.ts
export const FEATURE_FLAGS = {
  enable_<feature>: {
    enabled: false,  // Start disabled
    description: '<DESCRIPTION>',
    rolloutPercentage: 0,
  },
} as const;
```

# Step 4: Implement ADDED Requirements (Testable Core - Article I)

Read `constitution.profile` from `steering/project.yml` (default `library` when absent, P-2) and use the matching variant.

For each new requirement:

1. Create the core module:
   - library / cli profile: library directory `lib/<feature>/` (I-L1)
   - application profile: folder under a core path, e.g. `src/lib/<feature>/`, no own package.json (I-A1, I-A2)

2. Create core files:
   - library / cli profile:
     - `lib/<feature>/index.ts`
     - `lib/<feature>/types.ts`
     - `lib/<feature>/<feature>.ts`
     - `lib/<feature>/<feature>.test.ts`
     - `lib/<feature>/cli.ts` (Article II, II-L1)
   - application profile:
     - `src/lib/<feature>/index.ts`
     - `src/lib/<feature>/<feature>.ts`
     - `src/lib/<feature>/<feature>.test.ts` (runs without the app server, I-2)

3. Write tests FIRST (RED-GREEN-BLUE):
   - RED: Write failing test
   - GREEN: Implement to pass
   - BLUE: Refactor

4. Create the automation interface (Article II):
   - library / cli profile: executable CLI in `lib/<feature>/cli.ts` with `--help` (II-L1, II-L2), added to package.json bin section
   - application profile: no CLI (II-A3); the route handler is the automation interface (II-A1). Ops tasks go in `scripts/<task>.ts` with `--help`, explicit target environment and `--dry-run`, registered in package.json (II-A6 to II-A9, advisory); every package.json script must reference an existing file (II-A10)

5. Integration layer (use framework directly):
   - API route in `app/api/<feature>/route.ts` (application profile: `src/app/api/<feature>/route.ts`)
   - Use Next.js features directly (no wrappers)
   - Check feature flag before executing
   - application profile: keep the route handler thin; it validates input against a schema (e.g. zod), authorizes, calls core and returns a status plus an error code (I-A3, II-A4, II-A5)

# Step 5: Modify Existing Code

For each MODIFIED requirement:

1. Find current implementation
2. Write tests for new behavior
3. Update implementation
4. Maintain backward compatibility (if needed)
5. Update tests

# Step 6: Remove Deprecated Code

For each REMOVED requirement:

1. Mark as deprecated FIRST (with warning)
2. Add deprecation notice
3. Create migration guide
4. Wait for deprecation period
5. Remove after period expires

# Step 7: Database Migrations

If schema changes needed:

1. Create migration: `npx prisma migrate dev --name <change-name>`
2. Write migration SQL
3. Write rollback SQL
4. Test migration forward and backward

# Step 8: Write Tests (80%+ Coverage)

Required tests:
- Unit tests for each function
- Integration tests (use REAL database and services instead of mocks - III-7, Article IX: IX-1)
- E2E tests for user workflows

Integration test example:
```typescript
describe('<Feature> Integration', () => {
  let prisma: PrismaClient;
  
  beforeAll(() => {
    prisma = new PrismaClient({
      datasources: { db: { url: process.env.TEST_DATABASE_URL } }
    });
  });
  
  it('should work with real database', async () => {
    // Use REAL services, not mocks
  });
});
```

# Step 9: Update Traceability Matrix

Create/update traceability document:

| Requirement ID | Design | Implementation | Tests | Status |
|----------------|--------|----------------|-------|--------|
| REQ-NEW-001 | Section X | lib/file.ts:L25 | test.ts:L40 | ✅ |

Verify:
- All requirements mapped
- Code coverage >= configured threshold, default 80% (III-6)
- All tests passing

# Step 10: Constitutional Validation

Verify compliance (per profile in `steering/project.yml`):
- Article I: Core module with tests that run without the UI, server or CLI; no delivery-path imports in core (I-2, I-3) ✓
  - library / cli: code in lib/ (I-L1)
  - application: code in src/lib/<feature>/, no UI-only code in core (I-A1, I-A4)
  - all profiles: exported functions and classes of core modules have a doc comment (`/** … */`) directly above them (I-5, advisory)
- Article II: Automation interface ✓
  - library / cli: CLI exists, `--help` works (II-L1, II-L2)
  - application: route handler validates input against a schema (II-A1, II-A4); package.json scripts resolve (II-A10)
- Article III: Tests written first (III-1) ✓
- Article III: Coverage >= configured threshold, default 80% (III-6) ✓
- Article IV: EARS format used ✓
- Article V: Traceability complete ✓
- Article VIII: Framework APIs used directly, no wrappers without Phase -1 Gate approval (VIII-1, VIII-2) ✓
- Article IX: Integration tests exist and use real services (IX-1) ✓

# Step 11: Update Steering

Update steering files with new information:

`steering/structure.md`:
- Add new component
- Document architecture pattern

`steering/tech.md`:
- Add new dependencies
- Document technology choices

# Step 12: Save Implementation Report

Save to: `storage/changes/<change-name>-implementation.md`

Include:
- Metadata (Change ID, status, dates)
- Changes applied (ADDED/MODIFIED/REMOVED)
- Test results (coverage, performance)
- Constitutional compliance checklist
- Deployment readiness checklist
- Next steps

# Step 13: Generate Summary

Present to user:
- Change name and ID
- Files added/modified/deprecated counts
- Test results and coverage
- Constitutional compliance status
- Quality metrics
- Deployment status
- Next steps (merge PR, deploy to staging, etc.)

# Validation Checklist

Before completing:
- Change proposal read
- Approval verified
- Steering context applied
- Feature flag created
- Project profile read from `steering/project.yml` (default `library`)
- Testable core implementation (Article I): library in lib/ for library / cli, core module in src/lib/ for application
- Exported functions and classes of core modules have doc comments (Article I: I-5, advisory)
- Automation interface provided (Article II): CLI for library / cli, schema-validated HTTP API for application
- Tests written first (Article III: III-1)
- Test coverage >= configured threshold, default 80% (III-6)
- Integration tests included, using real services (Article IX: IX-1)
- Traceability matrix updated
- Constitutional compliance verified
- Steering files updated
- Implementation report saved
- Summary presented

Execute the change implementation now.
"""
