name = "sdd-tasks"
description = "Break down design into implementation tasks with test-first approach"

[[instructions]]
role = "system"
content = """
You are executing the /sdd-tasks command to create an implementation task plan.

# Command Format

/sdd-tasks <feature-name>

Example: /sdd-tasks authentication

# Your Task

Create a detailed implementation task breakdown following test-first development approach.

# Step 1: Read Project Context

**IMPORTANT: Read these files FIRST:**

1. **Steering Context**:
   - `steering/structure.md` - Architecture patterns
   - `steering/tech.md` - Technology stack
   - `steering/rules/itg/README.md` - ITG delivery policies: read the files mapped to your task
   - `steering/project.yml` - `constitution.profile` (library | cli | application; `library` when absent)

2. **Requirements**:
   - `storage/specs/{{feature-name}}-requirements.md`

3. **Design**:
   - `storage/design/{{feature-name}}-design.md`

# Step 2: Task Breakdown Methodology

Follow Constitutional Article III: Test-First Imperative (Red-Green-Blue). The developer SHALL write each test before the production code that makes it pass (III-1).

For each component:
1. **RED**: Write failing test (III-2)
2. **GREEN**: Implement minimal code to pass test (III-3)
3. **BLUE**: Refactor and improve while keeping all tests passing (III-4)

# Step 3: Task Document Structure

## 1. Overview
- Feature name
- Total estimated tasks
- Dependencies
- Prerequisites

## 2. Task Breakdown

Group tasks by phase:

### Phase 1: Setup & Infrastructure
- Database migrations
- Environment configuration
- CI/CD setup

### Phase 2: Core Modules (Article I: Testable Core)
- Implement feature in a core module: `lib/<feature>/` (`library`, `cli`) or `src/lib/<feature>/` (`application`)
- Test-first development
- Automation interface (Article II): CLI (`library`, `cli`), or route handlers and server actions that delegate to core (`application`)

### Phase 3: API Integration
- API routes
- Request/response handling
- Validation

### Phase 4: Testing & Quality
- Integration tests
- E2E tests
- Security testing

### Phase 5: Documentation & Deployment
- API documentation
- User documentation
- Deployment configuration

## 3. Task Template

For each task:

**TASK-NNN: [Task Title]**

- **Phase**: Setup / Implementation / Testing / Documentation
- **Type**: Database / Backend / Frontend / Testing / DevOps
- **Description**: What needs to be done
- **Test-First Steps**:
  1. RED: Write test that fails
  2. GREEN: Implement code to pass test
  3. BLUE: Refactor and improve
- **Requirements**: Links to REQ-XXX-NNN
- **Design Reference**: Links to design sections
- **Estimated Effort**: S / M / L / XL
- **Dependencies**: Other tasks that must complete first
- **Acceptance Criteria**: How to verify completion
- **Files to Create/Modify**: Specific file paths

# Step 4: Example Task Breakdown

The example is the meeting RSVP feature (REQ-RSVP-001 to REQ-RSVP-003) of an ITG application (profile `application`).

## Phase 1: Setup

### TASK-001: Firestore Indexes and Rules for RSVPs
- **Phase**: Setup
- **Type**: Database
- **Description**: Add the `rsvps` collection's composite index and keep the rules denying all client access
- **Test-First Steps**:
  1. RED: Add the RSVP cases to the rules test (client read and write denied, ITG-SEC-16)
  2. GREEN: Add the index to `firestore.indexes.json`; `firestore.rules` stays deny-all
  3. BLUE: Remove indexes no query uses
- **Requirements**: REQ-RSVP-001
- **Design Reference**: Section 6 (Data Model)
- **Estimated Effort**: S
- **Dependencies**: None
- **Acceptance Criteria**:
  - Index deployed to both Firebase projects in the same change (ITG-PLT-23)
  - `check-rules` green on the PR (ITG-CI-01)
- **Files**:
  - `firestore.indexes.json` (modify)

### TASK-002: Feature Registration
- **Phase**: Setup
- **Type**: Backend
- **Description**: Declare the `rsvp` feature, so it can be switched off (ITG-SEC-23)
- **Test-First Steps**:
  1. RED: `check-feature-registry` fails on the new `src/features/rsvp/` folder
  2. GREEN: Add `rsvp` and its page paths to `src/lib/features/registry.ts`
  3. BLUE: —
- **Requirements**: All
- **Estimated Effort**: S
- **Dependencies**: None
- **Files**:
  - `src/lib/features/registry.ts` (modify)

## Phase 2: Core Module

### TASK-003: RSVP Service (RED-GREEN-BLUE)
- **Phase**: Implementation
- **Type**: Backend
- **Description**: Record an RSVP with the deadline and tenant rules, in the core module `src/lib/rsvp/` (I-A1)
- **Test-First Steps**:
  1. RED: Write tests for `recordRsvp`
     ```typescript
     // src/lib/rsvp/rsvp-service.test.ts
     describe('recordRsvp', () => {
       it('stores one RSVP per member and meeting', () => {
         // REQ-RSVP-001
       });
       it('rejects an RSVP after the deadline with RSVP_CLOSED', () => {
         // REQ-RSVP-002
       });
       it('rejects a member of another tenant', () => {
         // REQ-RSVP-003
       });
     });
     ```
  2. GREEN: Implement the service
     ```typescript
     // src/lib/rsvp/rsvp-service.ts
     export async function recordRsvp(tenantId: string, userId: string, input: RsvpInput): Promise<Rsvp>
     ```
  3. BLUE: Extract the deadline check, keep functions under 50 lines (VII-5)
- **Requirements**: REQ-RSVP-001, REQ-RSVP-002, REQ-RSVP-003
- **Design Reference**: Section 7 (Component Design)
- **Estimated Effort**: M
- **Dependencies**: TASK-001
- **Acceptance Criteria**:
  - Tests written first and passing; each names its REQ id (ITG-TST-01, ITG-TST-02)
  - Firestore through `src/lib/firebase-rest/firestore.ts`, tenant-scoped (ITG-PLT-14, ITG-SEC-10)
  - Errors are typed `ApiRouteError` helpers (`conflict('RSVP_CLOSED')`, `forbidden()`)
- **Files**:
  - `src/lib/rsvp/rsvp-service.ts` (create)
  - `src/lib/rsvp/rsvp-service.test.ts` (create)
- **`library` / `cli` profiles**: put the module in `lib/rsvp/` with its own tests and add a CLI task (II-L1); the `application` profile has no CLI (II-A3).

## Phase 3: API

### TASK-004: RSVP Route Handler (RED-GREEN-BLUE)
- **Phase**: Implementation
- **Type**: Backend
- **Description**: `POST /api/rsvp` through `withApiRoute` (ITG-SEC-13)
- **Test-First Steps**:
  1. RED: Route test: 401 without a token, 403 for another tenant, 409 after the deadline, 200 with the envelope
  2. GREEN: `withApiRoute('api-rsvp-create', withRole('member', handler), { rateLimit: 'write', schema, feature: 'rsvp' })`
  3. BLUE: Register the route id in `src/lib/logs/route-events.ts` (ITG-LOG-02)
- **Requirements**: REQ-RSVP-001, REQ-RSVP-002, REQ-RSVP-003
- **Design Reference**: Section 5 (API Design)
- **Estimated Effort**: M
- **Dependencies**: TASK-003
- **Acceptance Criteria**:
  - Identity and tenant only from the claims (ITG-SEC-06)
  - `rsvp.response.set`, `.denied` and `.failed` emitted; metadata keys registered in the allowlist (ITG-LOG-07, ITG-LOG-09)
  - `check-route-guards` and `check-route-logging` green
- **Files**:
  - `src/app/api/rsvp/route.ts` (create)
  - `src/app/api/rsvp/route.test.ts` (create)

## Phase 4: Testing & Quality

### TASK-005: Integration and E2E Tests
- **Phase**: Testing
- **Type**: Testing
- **Description**: Run the flow against the staging project as the fixed test users (ITG-TST-06, ITG-TST-12)
- **Requirements**: All REQ-RSVP-*
- **Design Reference**: Section 12 (Testing Strategy)
- **Estimated Effort**: M
- **Dependencies**: TASK-004
- **Acceptance Criteria**:
  - Data only under `ci-<run-id>`, cleaned up (ITG-TST-08)
  - A member of the second tenant is blocked (ITG-TST-09)
  - Playwright: a member RSVPs and sees the updated list (ITG-TST-10)
  - Coverage at or above the `application` threshold (III-6)
- **Files**:
  - `src/lib/rsvp/rsvp.integration.test.ts` (create)
  - `tests/e2e/rsvp.spec.ts` (create)

### TASK-006: Security Checklist
- **Phase**: Testing
- **Type**: Security
- **Description**: Run the security release checklist for the new route (ITG-SEC)
- **Requirements**: Security requirements
- **Design Reference**: Section 9 (Security Design)
- **Estimated Effort**: S
- **Dependencies**: TASK-005
- **Acceptance Criteria**:
  - Guard, rate limit and zod schema on the route
  - No names or emails in the RSVP events
  - Kill switch: with `rsvp` switched off, page and route answer 404 (ITG-SEC-24)

## 4. Requirements Coverage Matrix

Map tasks to requirements (V-6):

| Requirement | Tasks | Status |
|-------------|-------|--------|
| REQ-RSVP-001 | TASK-001, TASK-003, TASK-004, TASK-005 | Pending |
| REQ-RSVP-002 | TASK-003, TASK-004 | Pending |
| REQ-RSVP-003 | TASK-003, TASK-004, TASK-005 | Pending |

## 5. Dependency Graph

```
TASK-001 (Indexes and rules)
  └─> TASK-003 (RSVP service)
      └─> TASK-004 (Route handler)
          └─> TASK-005 (Integration and E2E tests)
              └─> TASK-006 (Security checklist)

TASK-002 (Feature registration) ──> TASK-004
```

## 6. Estimation Summary

- **Small (S)**: 2-4 hours
- **Medium (M)**: 4-8 hours
- **Large (L)**: 1-2 days
- **Extra Large (XL)**: 2-5 days

**Total Estimate**: 2-3 days

# Step 5: Save Task Breakdown

Save to: `storage/tasks/{{feature-name}}-tasks.md`

# Validation Checklist

Before finalizing:

1. **Requirements Coverage**:
   - All requirements from requirements.md have tasks (V-6)
   - No missing functionality

2. **Test-First Compliance**:
   - Each task follows RED-GREEN-BLUE (III-2 to III-4)
   - Tests written before implementation (III-1)
   - Acceptance criteria testable

3. **Constitutional Compliance**:
   - Testable core: core logic in a core module, `lib/` (`library`, `cli`) or e.g. `src/lib/` (`application`) (I-1)
   - Automation interface: task for CLI created (`library`, `cli`), or route handler tasks with schema validation for machine-facing endpoints (`application`, II-A4)
   - Test-first: RED-GREEN-BLUE for all tasks

4. **Dependencies**:
   - Task order logical
   - No circular dependencies
   - Prerequisites clear

# Next Steps

After tasks are complete:
1. User reviews and adjusts task breakdown
2. Proceed to implementation: /sdd-implement {{feature-name}}
3. Or validate compliance: /sdd-validate {{feature-name}}

**Execute task breakdown now.**
"""
