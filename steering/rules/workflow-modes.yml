# Workflow Modes Configuration
# 
# Defines lightweight workflow modes based on feature size
# See: docs/plans/musubi-improvement-plan-v0.8.md

schema_version: "1.0"

# Workflow mode definitions
modes:
  small:
    description: "1-2 hours of work (bug fixes, small feature additions)"
    estimated_duration: "1-2h"
    stages:
      - requirements   # Simplified requirements definition
      - implement      # Implementation (including tests)
      - validate       # Validation
    skip_artifacts:
      - design.md
      - tasks.md
    requirements:
      coverage_threshold: 60
      ears_format: optional
      traceability: relaxed
    use_cases:
      - "Bug fixes"
      - "Documentation updates"
      - "Configuration changes"
      - "Small refactoring"
      - "Dependency updates"

  medium:
    description: "1-2 days of work (medium-sized features)"
    estimated_duration: "1-2d"
    stages:
      - requirements
      - design
      - tasks
      - implement
      - validate
    skip_artifacts: []
    requirements:
      coverage_threshold: 70
      ears_format: required
      traceability: standard
    use_cases:
      - "Adding a new API"
      - "Extending existing features"
      - "Performance improvements"
      - "Adding a test suite"
      - "Integration features"

  large:
    description: "1 week or more (large features, new modules)"
    estimated_duration: "1w+"
    stages:
      - steering       # Update project memory
      - requirements   # Detailed requirements definition
      - design         # Architecture design
      - tasks          # Task breakdown
      - implement      # Implementation
      - validate       # Validation
      - review         # Review
    skip_artifacts: []
    requirements:
      coverage_threshold: 80
      ears_format: required
      traceability: strict
      adr_required: true
    use_cases:
      - "Creating a new module"
      - "Architecture changes"
      - "Breaking changes"
      - "Support for a new platform"
      - "Security features"

# Default mode selection rules
auto_detection:
  enabled: true
  rules:
    - pattern: "fix:|bugfix:|hotfix:"
      mode: small
    - pattern: "docs:|chore:|style:"
      mode: small
    - pattern: "feat:|feature:"
      mode: medium
    - pattern: "refactor:|perf:"
      mode: medium
    - pattern: "breaking:|major:|arch:"
      mode: large

# Stage definitions (full list)
stages:
  spike:
    description: "Technical research and PoC"
    optional: true
    outputs:
      - spike-{topic}.md
    agents:
      - software-developer
      - system-architect
    
  steering:
    description: "Update project memory"
    optional: true
    outputs:
      - steering/structure.md
      - steering/tech.md
    agents:
      - steering-agent
    
  requirements:
    description: "Requirements definition (EARS format)"
    optional: false
    outputs:
      - requirements.md
    agents:
      - requirements-analyst
    templates:
      - steering/templates/requirements.md
      
  design:
    description: "Technical design (C4 model)"
    optional: false
    outputs:
      - design.md
      - adr-*.md
    agents:
      - system-architect
    templates:
      - steering/templates/design.md
      
  tasks:
    description: "Task breakdown"
    optional: false
    outputs:
      - tasks.md
    agents:
      - task-decomposer
    templates:
      - steering/templates/tasks.md
      
  implement:
    description: "Implementation (TDD)"
    optional: false
    outputs:
      - source files
      - test files
    agents:
      - software-developer
      - code-generator
    sub_stages:
      - implement-test   # Tests only (Red Phase)
      - implement-code   # Code only (Green Phase)
      - implement-refactor  # Refactoring (Blue Phase)
      
  validate:
    description: "Validation and quality checks"
    optional: false
    outputs:
      - validation-report.md
    agents:
      - constitution-enforcer
      - traceability-auditor
    checks:
      - coverage
      - linting
      - type-check
      - traceability
      
  review:
    description: "Code review"
    optional: true
    outputs:
      - review-comments.md
    agents:
      - code-reviewer
      
  testing:
    description: "Integration and E2E testing"
    optional: true
    outputs:
      - test-report.md
    agents:
      - test-runner
      
  deployment:
    description: "Deployment"
    optional: true
    outputs:
      - deployment-log.md
    agents:
      - release-manager
      
  monitoring:
    description: "Monitoring and metrics review"
    optional: true
    outputs:
      - monitoring-report.md
    agents:
      - monitoring-agent
      
  retrospective:
    description: "Retrospective"
    optional: true
    outputs:
      - retrospective.md
    agents:
      - retrospective-facilitator

# Transitions between stages
transitions:
  spike:
    next: [requirements]
  steering:
    next: [requirements]
  requirements:
    next: [design, implement]  # small mode can skip design
  design:
    next: [tasks]
  tasks:
    next: [implement]
  implement:
    next: [validate, review]
  validate:
    next: [review, implement]  # can loop back
  review:
    next: [testing, implement]
  testing:
    next: [deployment, implement, requirements]  # feedback loops
  deployment:
    next: [monitoring]
  monitoring:
    next: [retrospective]
  retrospective:
    next: [requirements]  # new iteration
