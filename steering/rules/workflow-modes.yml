# Workflow Modes Configuration
# 
# Defines lightweight workflow modes based on feature size
# See: docs/plans/musubi-improvement-plan-v0.8.md

schema_version: "1.0"

# Workflow mode definitions
modes:
  small:
    description: "1-2時間の作業（バグ修正、小機能追加）"  # EN: 1-2 hours of work (bug fixes, small feature additions)
    estimated_duration: "1-2h"
    stages:
      - requirements   # 簡易要件定義 / Simplified requirements definition
      - implement      # 実装（テスト含む） / Implementation (including tests)
      - validate       # 検証 / Validation
    skip_artifacts:
      - design.md
      - tasks.md
    requirements:
      coverage_threshold: 60
      ears_format: optional
      traceability: relaxed
    use_cases:
      - "バグ修正"  # EN: Bug fixes
      - "ドキュメント更新"  # EN: Documentation updates
      - "設定変更"  # EN: Configuration changes
      - "小規模リファクタリング"  # EN: Small-scale refactoring
      - "依存関係の更新"  # EN: Dependency updates

  medium:
    description: "1-2日の作業（中規模機能）"  # EN: 1-2 days of work (medium-sized features)
    estimated_duration: "1-2d"
    stages:
      - requirements
      - design
      - tasks
      - implement
      - validate
    skip_artifacts: []
    requirements:
      coverage_threshold: 70
      ears_format: required
      traceability: standard
    use_cases:
      - "新規API追加"  # EN: Adding new APIs
      - "既存機能の拡張"  # EN: Extending existing features
      - "パフォーマンス改善"  # EN: Performance improvements
      - "テストスイート追加"  # EN: Adding test suites
      - "統合機能"  # EN: Integration features

  large:
    description: "1週間以上（大規模機能、新モジュール）"  # EN: 1 week or more (large features, new modules)
    estimated_duration: "1w+"
    stages:
      - steering       # プロジェクト記憶更新 / Update project memory
      - requirements   # 詳細要件定義 / Detailed requirements definition
      - design         # アーキテクチャ設計 / Architecture design
      - tasks          # タスク分解 / Task decomposition
      - implement      # 実装 / Implementation
      - validate       # 検証 / Validation
      - review         # レビュー / Review
    skip_artifacts: []
    requirements:
      coverage_threshold: 80
      ears_format: required
      traceability: strict
      adr_required: true
    use_cases:
      - "新規モジュール作成"  # EN: Creating new modules
      - "アーキテクチャ変更"  # EN: Architecture changes
      - "破壊的変更"  # EN: Breaking changes
      - "新規プラットフォーム対応"  # EN: Supporting new platforms
      - "セキュリティ機能"  # EN: Security features

# Default mode selection rules
auto_detection:
  enabled: true
  rules:
    - pattern: "fix:|bugfix:|hotfix:"
      mode: small
    - pattern: "docs:|chore:|style:"
      mode: small
    - pattern: "feat:|feature:"
      mode: medium
    - pattern: "refactor:|perf:"
      mode: medium
    - pattern: "breaking:|major:|arch:"
      mode: large

# Stage definitions (full list)
stages:
  spike:
    description: "技術調査・PoC"  # EN: Technical investigation / PoC
    optional: true
    outputs:
      - spike-{topic}.md
    agents:
      - software-developer
      - system-architect
    
  steering:
    description: "プロジェクト記憶の更新"  # EN: Updating project memory
    optional: true
    outputs:
      - steering/structure.md
      - steering/tech.md
    agents:
      - steering-agent
    
  requirements:
    description: "要件定義（EARS形式）"  # EN: Requirements definition (EARS format)
    optional: false
    outputs:
      - requirements.md
    agents:
      - requirements-analyst
    templates:
      - steering/templates/requirements.md
      
  design:
    description: "技術設計（C4モデル）"  # EN: Technical design (C4 model)
    optional: false
    outputs:
      - design.md
      - adr-*.md
    agents:
      - system-architect
    templates:
      - steering/templates/design.md
      
  tasks:
    description: "タスク分解"  # EN: Task decomposition
    optional: false
    outputs:
      - tasks.md
    agents:
      - task-decomposer
    templates:
      - steering/templates/tasks.md
      
  implement:
    description: "実装（TDD）"  # EN: Implementation (TDD)
    optional: false
    outputs:
      - source files
      - test files
    agents:
      - software-developer
      - code-generator
    sub_stages:
      - implement-test   # テストのみ（Red Phase） / Tests only (Red Phase)
      - implement-code   # コードのみ（Green Phase） / Code only (Green Phase)
      - implement-refactor  # リファクタ（Blue Phase） / Refactor (Blue Phase)
      
  validate:
    description: "検証・品質チェック"  # EN: Validation / quality checks
    optional: false
    outputs:
      - validation-report.md
    agents:
      - constitution-enforcer
      - traceability-auditor
    checks:
      - coverage
      - linting
      - type-check
      - traceability
      
  review:
    description: "コードレビュー"  # EN: Code review
    optional: true
    outputs:
      - review-comments.md
    agents:
      - code-reviewer
      
  testing:
    description: "統合・E2Eテスト"  # EN: Integration / E2E tests
    optional: true
    outputs:
      - test-report.md
    agents:
      - test-runner
      
  deployment:
    description: "デプロイ"  # EN: Deployment
    optional: true
    outputs:
      - deployment-log.md
    agents:
      - release-manager
      
  monitoring:
    description: "監視・メトリクス確認"  # EN: Monitoring / metrics review
    optional: true
    outputs:
      - monitoring-report.md
    agents:
      - monitoring-agent
      
  retrospective:
    description: "振り返り"  # EN: Retrospective
    optional: true
    outputs:
      - retrospective.md
    agents:
      - retrospective-facilitator

# Transitions between stages
transitions:
  spike:
    next: [requirements]
  steering:
    next: [requirements]
  requirements:
    next: [design, implement]  # small mode can skip design
  design:
    next: [tasks]
  tasks:
    next: [implement]
  implement:
    next: [validate, review]
  validate:
    next: [review, implement]  # can loop back
  review:
    next: [testing, implement]
  testing:
    next: [deployment, implement, requirements]  # feedback loops
  deployment:
    next: [monitoring]
  monitoring:
    next: [retrospective]
  retrospective:
    next: [requirements]  # new iteration
