# Constitution Levels Configuration
#
# Defines enforcement levels for Constitutional Articles
# See: docs/plans/musubi-improvement-plan-v0.8.md

schema_version: "1.0"

# Constitution enforcement levels
levels:
  critical:
    description: "Blocks on violation (required)"
    enforcement: block
    articles:
      - id: CONST-001
        name: "Article I - Library-First Principle"
        description: "Implement every feature as a library first"
        required: true
        
      - id: CONST-003
        name: "Article III - Test-First Imperative"
        description: "Test-first development (Red-Green-Blue)"
        required: true
        
      - id: CONST-005
        name: "Article V - Traceability Mandate"
        description: "100% traceability across requirements <-> design <-> code <-> tests"
        required: true

  advisory:
    description: "Warning only on violation"
    enforcement: warn
    articles:
      - id: CONST-002
        name: "Article II - CLI Interface Mandate"
        description: "Provide a CLI interface"
        reason: "Internal libraries may not need a CLI"
        
      - id: CONST-004
        name: "Article IV - EARS Requirements Format"
        description: "Requirements definition in EARS format"
        reason: "A simple format is sufficient for small changes"
        
      - id: CONST-006
        name: "Article VI - Constitution Enforcement"
        description: "Validation by the Constitution enforcer"
        reason: "Runs automatically in CI"
        
      - id: CONST-009
        name: "Article IX - Real Service Testing"
        description: "Testing with real services"
        reason: "Mocking LLM/external API calls is acceptable"
        exception_cases:
          - llm_providers
          - external_payment_apis
          - third_party_services

  flexible:
    description: "Can be overridden in project settings"
    enforcement: configurable
    articles:
      - id: CONST-007
        name: "Article VII - Documentation Requirements"
        description: "Documentation requirements"
        
      - id: CONST-008
        name: "Article VIII - Code Quality Standards"
        description: "Code quality standards"

# Configurable settings
configurable:
  coverage_threshold:
    description: "Test coverage thresholds"
    default: 80
    min: 50
    max: 100
    per_package: true  # Configurable per package
    
  mock_allowed:
    description: "Allow use of mocks"
    default: false
    exceptions:
      - llm_providers
      - external_apis
      - payment_services
      - analytics_services
      
  ears_required:
    description: "EARS format required"
    default: true
    per_mode: true  # Configurable per workflow mode
    mode_defaults:
      small: false
      medium: true
      large: true
      
  adr_required:
    description: "ADR (Architecture Decision Record) required"
    default: false
    per_mode: true
    mode_defaults:
      small: false
      medium: false
      large: true

# Validation rules
validation:
  # Skip validation for specific paths
  skip_paths:
    - "**/*.test.js"
    - "**/*.spec.js"
    - "**/fixtures/**"
    - "**/mocks/**"
    - "**/testdata/**"
    
  # Custom rules per package type
  package_rules:
    library:
      coverage_threshold: 90
      mock_allowed: false
      ears_required: true
      
    cli:
      coverage_threshold: 70
      mock_allowed: true
      ears_required: true
      
    application:
      coverage_threshold: 60
      mock_allowed: true
      ears_required: false
      
    extension:
      coverage_threshold: 60
      mock_allowed: true
      ears_required: false
      
    infrastructure:
      coverage_threshold: 50
      mock_allowed: true
      ears_required: false

# Override mechanism
# Projects can override in steering/project.yml:
#
# constitution:
#   level: advisory  # strict | advisory | relaxed
#   overrides:
#     coverage_threshold: 70
#     mock_allowed:
#       - "@openai/api"
#       - "@anthropic/sdk"
